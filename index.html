<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Cantoche – Roue des cadeaux</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
}

header{
  text-align:center;
  margin-bottom:12px;
}

header img{
  height:70px;
  max-width:90vw;
}

header h1{
  margin:6px 0 0;
  font-size:24px;
}

.instructions{
  text-align:center;
  font-size:14px;
  line-height:1.45;
  max-width:340px;
  margin-bottom:12px;
}

.instructions strong{
  color:#ffbf3f;
}

.link-avis{
  display:inline-block;
  margin-bottom:14px;
  padding:10px 18px;
  background:#00205b;
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

/* =========================
   ROUE
========================= */

.wheel-container{
  position:relative;
  width:320px;
  height:320px;
}

canvas{
  width:100%;
  height:100%;
}

.arrow{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  color:white;
  z-index:10;
  text-shadow:0 2px 4px #000;
}

/* =========================
   AVERTISSEMENT
========================= */

.warning{
  width:320px;
  margin-top:14px;
  margin-bottom:4px;
  padding:10px 12px;
  background:#3a1f1f;
  border:2px solid #ffbf3f;
  border-radius:10px;
  color:#fff;
  text-align:center;
  font-size:12px;
  line-height:1.4;
}

.warning strong{
  color:#ffbf3f;
  font-size:14px;
}

/* =========================
   BOUTONS
========================= */

.buttons{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:320px;
  margin-top:10px;
}

button{
  padding:12px 18px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  background:#555;
  color:#999;
  cursor:not-allowed;
}

#confirmBtn{
  background:#957241;
  color:#fff;
}

#spinBtn{
  background:#ffbf3f;
  color:#111;
}

/* =========================
   POPUP
========================= */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.popup-content{
  background:#fff;
  color:#111;
  padding:22px;
  border-radius:14px;
  width:86%;
  max-width:340px;
  text-align:center;
}

.popup-content h2{
  margin-top:0;
}

.popup-content button{
  margin-top:14px;
  background:#ffbf3f;
  color:#111;
}

</style>
</head>

<body>

<header>

  <img
    src="https://lacantochelescar.fr/wp-content/uploads/2021/06/LA-CANTOCHE-LOGO-HEADER.png"
    alt="La Cantoche"
  />

  <h1>Roue des cadeaux</h1>

</header>


<div class="instructions">

  ⭐ <strong>Laissez-nous un avis Google</strong><br />

  👀 Montrez-le à un membre de l'équipe<br />

  🎡 Tournez la roue avec lui<br />

  🎁 <strong>Les lots sont immédiats</strong>

</div>


<a
  class="link-avis"
  href="https://g.page/r/CefIMqGZfiXREBM/review"
  target="_blank"
>
  ⭐ Laisser un avis Google
</a>


<!-- =========================
     ROUE
========================= -->

<div class="wheel-container">

  <div class="arrow">▼</div>

  <canvas
    id="wheel"
    width="700"
    height="700">
  </canvas>

</div>


<!-- =========================
     AVERTISSEMENT
========================= -->

<div class="warning">

  ⚠️ <strong>ATTENTION</strong><br />

  LE LOT N'EST VALABLE QU'APRÈS<br />

  VÉRIFICATION DE L'AVIS PAR UN MEMBRE DE L'ÉQUIPE.

</div>


<!-- =========================
     BOUTONS
========================= -->

<div class="buttons">

  <button id="confirmBtn">
    J'ai laissé mon avis
  </button>

  <button id="spinBtn" disabled>
    Tourner la roue 🎡
  </button>

</div>


<!-- =========================
     POPUP
========================= -->

<div
  class="popup"
  id="popup">

  <div class="popup-content">

    <h2>🎉 Félicitations !</h2>

    <p
      id="popupResult"
      style="font-size:20px;font-weight:bold;">
    </p>

    <button onclick="closePopup()">
      Super !
    </button>

  </div>

</div>


<script>

/* =====================================================
   RÉCUPÉRATION DU CANVAS
===================================================== */

const canvas =
  document.getElementById("wheel");

const ctx =
  canvas.getContext("2d");


/* =====================================================
   LOTS
===================================================== */

const rewards = [

  "Café offert",

  "Boisson offerte",

  "Cookie Nutella",

  "Schoko-Bons",

  "Compliment du serveur",

  "Coupon de réduction",

  "Nettoyage des toilettes",

  "Snack sucré",

  "Pringles",

  "Dommage, c'est perdu"

];


/* =====================================================
   COULEURS
===================================================== */

const colors = [

  "#ffbf3f",

  "#957241"

];


/* =====================================================
   CONFIGURATION
===================================================== */

const total =
  rewards.length;

const angle =
  (2 * Math.PI) / total;

const center =
  350;

const radius =
  330;


/* =====================================================
   DESSIN DE LA ROUE
===================================================== */

function drawWheel(rotation = 0){

  /*
     On remet le canvas à zéro
  */

  ctx.setTransform(
    1,0,0,1,0,0
  );

  ctx.clearRect(
    0,
    0,
    700,
    700
  );


  /*
     Centre de rotation
  */

  ctx.translate(
    center,
    center
  );


  /*
     Rotation de la roue
  */

  ctx.rotate(
    rotation
  );


  /*
     Retour au repère normal
  */

  ctx.translate(
    -center,
    -center
  );


  /* ===============================================
     DESSIN DES 10 CASES
  =============================================== */

  for(
    let i = 0;
    i < total;
    i++
  ){

    /*
       La première case commence à -90°,
       donc la roue est parfaitement alignée
       avec la flèche.
    */

    const start =
      -Math.PI / 2 +
      i * angle;

    const end =
      start + angle;


    ctx.beginPath();

    ctx.moveTo(
      center,
      center
    );

    ctx.arc(
      center,
      center,
      radius,
      start,
      end
    );

    ctx.closePath();


    ctx.fillStyle =
      colors[i % 2];

    ctx.fill();


    /* =========================================
       TEXTE
    ========================================= */

    ctx.save();


    ctx.translate(
      center,
      center
    );


    /*
       Position du texte au centre de la case
    */

    ctx.rotate(
      start + angle / 2
    );


    ctx.textAlign =
      "right";

    ctx.textBaseline =
      "middle";

    ctx.fillStyle =
      "#111";

    ctx.font =
      "bold 20px Arial";


    const text =
      rewards[i];

    const maxWidth =
      210;


    wrapText(
      text,
      285,
      0,
      maxWidth,
      22
    );


    ctx.restore();

  }


  /* =================================================
     CENTRE
  ================================================= */

  ctx.beginPath();

  ctx.arc(
    center,
    center,
    40,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#00205b";

  ctx.fill();

}


/* =====================================================
   TEXTE MULTILIGNE
===================================================== */

function wrapText(
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const words =
    text.split(" ");

  let line =
    "";

  let lines =
    [];


  for(
    let n = 0;
    n < words.length;
    n++
  ){

    const testLine =
      line +
      words[n] +
      " ";

    const metrics =
      ctx.measureText(
        testLine
      );


    if(
      metrics.width > maxWidth &&
      n > 0
    ){

      lines.push(
        line.trim()
      );

      line =
        words[n] +
        " ";

    }else{

      line =
        testLine;

    }

  }


  lines.push(
    line.trim()
  );


  const offset =
    (lines.length - 1) *
    lineHeight /
    2;


  lines.forEach(
    (l, idx) => {

      ctx.fillText(
        l,
        x,
        y -
        offset +
        idx *
        lineHeight
      );

    }
  );

}


/* =====================================================
   AFFICHAGE INITIAL
===================================================== */

drawWheel();


/* =====================================================
   BOUTONS
===================================================== */

const confirmBtn =
  document.getElementById(
    "confirmBtn"
  );

const spinBtn =
  document.getElementById(
    "spinBtn"
  );


/* =====================================================
   CONFIRMATION DE L'AVIS
===================================================== */

confirmBtn.addEventListener(
  "click",
  () => {

    spinBtn.disabled =
      false;

    confirmBtn.disabled =
      true;

  }
);


/* =====================================================
   EMPÊCHER DOUBLE CLIC
===================================================== */

let spinning =
  false;


/* =====================================================
   LANCEMENT DE LA ROUE
===================================================== */

spinBtn.addEventListener(
  "click",
  () => {

    if(spinning)
      return;


    spinning =
      true;


    spinBtn.disabled =
      true;


    /* ===============================================
       CHOIX DU LOT
    =============================================== */

    const index =
      Math.floor(
        Math.random() *
        total
      );


    const reward =
      rewards[index];


    /* ===============================================
       CALCUL DU CENTRE DE LA CASE
    =============================================== */

    const segmentCenter =
      -90 +
      index *
      (360 / total) +
      (360 / total) / 2;


    /*
       La flèche est à -90°.

       On calcule donc la rotation nécessaire
       pour placer le centre de la case choisie
       exactement sous la flèche.
    */

    let targetRotation =
      -90 -
      segmentCenter;


    /* ===============================================
       NORMALISATION
    =============================================== */

    targetRotation =
      (
        (targetRotation % 360)
        + 360
      ) % 360;


    /* ===============================================
       NOMBRE DE TOURS
    =============================================== */

    const fullTurns =
      6;


    const finalRotation =
      fullTurns *
      360 +
      targetRotation;


    /* ===============================================
       ANIMATION
    =============================================== */

    let start =
      null;


    function animate(timestamp){

      if(!start)
        start =
          timestamp;


      const progress =
        Math.min(
          (timestamp - start) /
          4500,
          1
        );


      /*
         Ralentissement progressif
      */

      const ease =
        1 -
        Math.pow(
          1 - progress,
          4
        );


      const rotationDeg =
        finalRotation *
        ease;


      drawWheel(
        rotationDeg *
        Math.PI /
        180
      );


      if(progress < 1){

        requestAnimationFrame(
          animate
        );

      }else{

        /*
           Position finale exacte
        */

        drawWheel(
          finalRotation *
          Math.PI /
          180
        );


        spinning =
          false;


        showPopup(
          reward
        );

      }

    }


    requestAnimationFrame(
      animate
    );

  }
);


/* =====================================================
   AFFICHAGE DU RÉSULTAT
===================================================== */

function showPopup(text){

  document.getElementById(
    "popupResult"
  ).textContent =
    text;


  document.getElementById(
    "popup"
  ).style.display =
    "flex";

}


/* =====================================================
   FERMETURE DU POPUP
===================================================== */

function closePopup(){

  document.getElementById(
    "popup"
  ).style.display =
    "none";


  confirmBtn.disabled =
    false;

}

</script>

</body>
</html>
